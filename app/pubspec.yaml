name: notifier
description: "Alert inbox for the notifier service: receives FCM pushes from systems and shows their details."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5
  intl: ^0.20.2
  http: ^1.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Build-time only: turns assets/icon/*.png into the mipmap densities.
  # Regenerate with `task app:icon`.
  flutter_launcher_icons: ^0.14.4

# Source images are produced by tool/make_icon.py; they are build inputs, not
# runtime assets, so they are deliberately absent from `flutter: assets:`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0A0A0B"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  # Themed icons: the launcher tints this silhouette to match the wallpaper.
  adaptive_icon_monochrome: assets/icon/icon_foreground.png
  min_sdk_android: 37

flutter:
  uses-material-design: true

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
